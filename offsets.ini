# CS2 ESP offset table.
# Values below are for the build dumped 2026-11-20 (a2x/cs2-dumper).
# If CS2 patches, re-dump and replace these. Missing keys fall back to 0.
#
# Format: key = 0xVALUE   (# starts a comment)

[client]
dwLocalPlayerController = 0x252F300
dwEntityList            = 0x270D5B0
dwViewMatrix            = 0x255D3D0
dwGlobalVars            = 0x2223AD0

[netvars]
m_iTeamNum        = 0x3E7
m_iHealth         = 0x34C
m_lifeState       = 0x354
m_hPlayerPawn     = 0x92C
m_pGameSceneNode  = 0x330
m_modelState      = 0x140
m_vecAbsOrigin    = 0xC8
m_bDormant        = 0x103
m_szWeaponName    = 0x0

[geometry]
entity_list_chunk_base   = 0x10
entity_list_chunk_stride = 0x8
entity_list_entry_stride = 0x70
bone_array_offset        = 0x80
bone_stride              = 0x20
bone_pos_offset          = 0x10

[settings]
max_players = 64
